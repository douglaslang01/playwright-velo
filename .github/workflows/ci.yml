# ============================================================
# Continuous Integration
# ------------------------------------------------------------
# Propósito: workflow de CI focado exclusivamente na execução
# de testes unitários (Vitest) a cada push na branch main.
# Estrutura simples e pronta para expansão futura (ex.: lint,
# build, cache, matrix, deploy, etc.) sem alterar o fluxo atual.
# ============================================================

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  # Versão do Node.js utilizada em todo o workflow
  NODE_VERSION: '24'
  # Token do Vercel para autenticação
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código-fonte do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # 2. Configura o ambiente Node.js na versão definida em NODE_VERSION
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn corretamente
      - name: Enable Corepack (Yarn)
        run: corepack enable

      # 4. Instala as dependências do projeto usando o yarn.lock
      - name: Install dependencies
        run: yarn install

      # 5. Executa os testes unitários com Vitest
      - name: Run unit tests
        run: yarn test
  
  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código-fonte do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # 2. Configura o ambiente Node.js na versão definida em NODE_VERSION
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn corretamente
      - name: Enable Corepack (Yarn)
        run: corepack enable

      # 4. Instala as dependências do projeto usando o yarn.lock
      - name: Install dependencies
        run: yarn install

      # 5. Valida se as credenciais do Vercel estão presentes e no formato esperado
      #    (não expõe os valores, apenas confirma tamanho e prefixo)
      - name: Validate Vercel credentials
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN, VERCEL_ORG_ID ou VERCEL_PROJECT_ID não estão definidos nos secrets."
            exit 1
          fi
          echo "ORG_ID começa com team_? $(echo "$VERCEL_ORG_ID" | grep -q '^team_' && echo sim || echo NAO)"
          echo "PROJECT_ID começa com prj_? $(echo "$VERCEL_PROJECT_ID" | grep -q '^prj_' && echo sim || echo NAO)"

      # 6. Obter as configurações do Vercel
      - name: Pull Vercel Config
        run: yarn vercel pull --yes --environment=preview --scope=$VERCEL_SCOPE --token=$VERCEL_TOKEN
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # 7. Build para o Vercel
      - name: Build for Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # 8. Deploy Preview no Vercel
      - name: Deploy Preview
        run: yarn vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN