# ============================================================
# Continuous Integration
# ------------------------------------------------------------
# Propósito: workflow de CI focado exclusivamente na execução
# de testes unitários (Vitest) a cada push na branch main.
# Estrutura simples e pronta para expansão futura (ex.: lint,
# build, cache, matrix, deploy, etc.) sem alterar o fluxo atual.
# ============================================================

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  # Versão do Node.js utilizada em todo o workflow
  NODE_VERSION: '24'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código-fonte do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # 2. Configura o ambiente Node.js na versão definida em NODE_VERSION
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn corretamente
      - name: Enable Corepack (Yarn)
        run: corepack enable

      # 4. Instala as dependências do projeto usando o yarn.lock
      - name: Install dependencies
        run: yarn install

      # 5. Executa os testes unitários com Vitest
      - name: Run unit tests
        run: yarn test
